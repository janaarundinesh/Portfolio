<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Social preview card — 1200 × 630</title>
<!--
  Source for assets/preview.jpeg. Open it at exactly 1200 × 630 and screenshot the
  viewport; the flow field stops itself after FIELD_FRAMES so the capture is stable.
  Kept in the repo so the card can be regenerated when the name, role line or
  accent colour changes. It is never linked from the site.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #05060a;
    --paper: #fcf8ed;
    --paper-dim: #9a978c;
    --acid: #ccff00;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--ink);
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    isolation: isolate;
    font-family: "Archivo", system-ui, sans-serif;
  }

  .field {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* soft lime bloom behind the portrait and a weaker one under the name */
  .glow {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(5, 6, 10, 0.78) 0%, rgba(5, 6, 10, 0.4) 32%, transparent 62%),
      radial-gradient(46% 62% at 72% 46%, rgba(150, 210, 0, 0.17), transparent 68%),
      radial-gradient(30% 40% at 58% 78%, rgba(120, 170, 0, 0.07), transparent 70%);
  }

  /* faint plotting grid, like the hero's */
  .grid {
    position: absolute;
    inset: 0;
    opacity: 0.5;
    background-image:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 96px),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 96px);
  }

  .rule-h,
  .rule-v {
    position: absolute;
    background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.16) 0 2px, transparent 2px 9px);
  }
  .rule-h { left: 0; right: 0; height: 1px; }
  .rule-v {
    top: 0; bottom: 0; width: 1px;
    background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.12) 0 2px, transparent 2px 10px);
  }

  .ring {
    position: absolute;
    border: 2px solid rgba(204, 255, 0, 0.55);
    border-radius: 50%;
  }
  .ring--dim { border-color: rgba(204, 255, 0, 0.28); }

  .dot {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--acid);
  }

  .copy {
    position: absolute;
    left: 71px;
    top: 140px;
    width: 660px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 38px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #a9a69a;
  }
  .eyebrow i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--acid);
    flex: none;
  }

  .name {
    margin: 0;
    font-size: 103px;
    font-weight: 900;
    line-height: 0.73;
    letter-spacing: -0.052em;
    color: var(--paper);
    text-transform: uppercase;
  }
  .name span { display: block; }
  .name span:last-child {
    color: transparent;
    -webkit-text-stroke: 2.5px #d9d4c6;
    text-stroke: 2.5px #d9d4c6;
  }

  .tick {
    display: block;
    width: 115px;
    height: 6px;
    margin: 13px 0 0;
    background: var(--acid);
  }

  .stats {
    position: absolute;
    left: 71px;
    bottom: 66px;
    display: grid;
    gap: 13px;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .stats strong {
    font-size: 18px;
    font-weight: 500;
    color: var(--paper);
  }
  .stats span {
    font-size: 18px;
    color: #8b887d;
  }

  .photo {
    position: absolute;
    left: 786px;
    top: 117px;
    width: 339px;
    height: 393px;
  }
  .photo__plate {
    position: absolute;
    inset: 0;
    transform: translate(19px, 10px);
    background: var(--acid);
  }
  .photo__frame {
    position: absolute;
    inset: 0;
    display: block;
    background: #0a0b0e;
    box-shadow: 0 26px 60px rgba(0, 0, 0, 0.55);
  }
  .photo__frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 18%;
  }
</style>
</head>
<body>
  <div class="card">
    <canvas class="field" data-field></canvas>
    <div class="glow"></div>
    <div class="grid"></div>

    <div class="rule-h" style="top: 208px"></div>
    <div class="rule-h" style="top: 566px"></div>
    <div class="rule-v" style="left: 700px"></div>

    <span class="ring" style="left: 300px; top: 92px; width: 16px; height: 16px"></span>
    <span class="ring ring--dim" style="left: 664px; top: 250px; width: 13px; height: 13px"></span>
    <span class="ring ring--dim" style="left: 742px; top: 402px; width: 10px; height: 10px"></span>
    <span class="ring" style="left: 596px; top: 318px; width: 12px; height: 12px"></span>
    <span class="ring ring--dim" style="left: 232px; top: 545px; width: 11px; height: 11px"></span>
    <span class="dot" style="left: 596px; top: 316px"></span>
    <span class="dot" style="left: 528px; top: 300px; width: 7px; height: 7px"></span>

    <div class="copy">
      <p class="eyebrow"><i></i>Software engineer · Wuppertal, Germany</p>
      <h1 class="name">
        <span>Arun</span>
        <span>Dinesh</span>
        <span>Jana</span>
      </h1>
      <i class="tick"></i>
    </div>

    <p class="stats">
      <strong>C++ · Python · MPI</strong>
      <span>Scientific computing · Parallel algorithms</span>
    </p>

    <div class="photo">
      <span class="photo__plate"></span>
      <span class="photo__frame">
        <img src="../assets/portrait.jpg" alt="" />
      </span>
    </div>
  </div>

<script>
  // The hero's flow field, traced in one synchronous pass so the card renders the
  // same in a browser tab and in a headless capture — no dependence on animation
  // frames or on how long the page has been open. The seeded generator means a
  // rerun with the same copy produces the same field.
  (function () {
    var canvas = document.querySelector("[data-field]");
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var width = canvas.clientWidth;
    var height = canvas.clientHeight;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var seed = 0x9e3779b9;
    var random = function () {
      seed = (seed + 0x6d2b79f5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    var rand = function (min, max) { return min + random() * (max - min); };

    var angle = function (x, y, t) {
      return (
        Math.sin(x * 0.0038 + t * 0.00021) * Math.PI +
        Math.cos(y * 0.0052 - t * 0.00017) * Math.PI * 0.7 +
        Math.sin((x + y) * 0.0016) * Math.PI * 0.4
      );
    };

    // Long, overlapping traces read like the hero's animated field but stay
    // reproducible: each particle draws its whole path as one stroke.
    var count = Math.round((width * height) / 2200);
    var STEP_COUNT = 1400;

    for (var i = 0; i < count; i++) {
      var p = {
        x: rand(-40, width + 40),
        y: rand(-40, height + 40),
        speed: rand(0.5, 1.5),
        life: rand(0.35, 1),
        tone: random() > 0.88 ? "paper" : "acid"
      };

      ctx.beginPath();
      ctx.moveTo(p.x, p.y);

      for (var s = 0; s < STEP_COUNT; s++) {
        var a = angle(p.x, p.y, s * 16);
        p.x += Math.cos(a) * p.speed;
        p.y += Math.sin(a) * p.speed;
        if (p.x < -60 || p.x > width + 60 || p.y < -60 || p.y > height + 60) break;
        ctx.lineTo(p.x, p.y);
      }

      var alpha = p.tone === "paper" ? 0.06 * p.life : 0.145 * p.life;
      var color = p.tone === "paper" ? "244,241,232" : "204,255,0";
      ctx.strokeStyle = "rgba(" + color + "," + alpha + ")";
      ctx.lineWidth = p.tone === "paper" ? 0.7 : 1;
      ctx.stroke();
    }

    document.documentElement.dataset.ready = "true";
  })();
</script>
</body>
</html>
